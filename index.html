<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Habbo RP - Calculadora de Turnos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f0f1d linear-gradient(135deg, #0d0e15 0%, #1a1c2e 100%);
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            overflow: hidden;
            position: relative;
        }

        /* Fundo Pixel com ícones caindo */
        .pixel-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .pixel-icon {
            position: absolute;
            font-size: 24px;
            opacity: 0.18;
            animation: floatDown linear infinite;
        }

        @keyframes floatDown {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.25;
            }
            90% {
                opacity: 0.25;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Container Principal */
        .card-container {
            background-color: rgba(32, 32, 36, 0.95);
            border: 2px solid #323238;
            border-radius: 12px;
            width: 380px;
            padding: 28px 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            z-index: 10;
            position: relative;
            backdrop-filter: blur(8px);
        }

        h1 {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 4px;
            color: #f75a68;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 0.85rem;
            text-align: center;
            color: #a8a8b3;
            margin-bottom: 20px;
        }

        /* Tela de Login */
        #loginScreen {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: #a8a8b3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            background-color: #121214;
            border: 1px solid #323238;
            border-radius: 6px;
            padding: 12px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #f75a68;
        }

        .btn-primary {
            background-color: #f75a68;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 6px;
        }

        .btn-primary:hover {
            background-color: #d6404e;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .error-message {
            color: #f75a68;
            font-size: 0.8rem;
            text-align: center;
            display: none;
            background: rgba(247, 90, 104, 0.1);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid rgba(247, 90, 104, 0.2);
        }

        /* Tela da Calculadora */
        #calcScreen {
            display: none;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #29292e;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 0.8rem;
        }

        .user-header span {
            color: #00b37e;
            font-weight: bold;
        }

        .btn-logout {
            background: transparent;
            border: none;
            color: #a8a8b3;
            cursor: pointer;
            font-size: 0.75rem;
            text-decoration: underline;
        }

        .btn-logout:hover {
            color: #f75a68;
        }

        .goal-info {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            background: #29292e;
            padding: 10px 14px;
            border-radius: 6px;
        }

        .goal-info span {
            color: #f75a68;
            font-weight: bold;
        }

        .step-indicator {
            font-size: 0.75rem;
            color: #00b37e;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .display-group {
            background-color: #121214;
            border: 1px solid #323238;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .display-label {
            font-size: 0.75rem;
            color: #a8a8b3;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .display-value {
            font-size: 1.6rem;
            text-align: right;
            color: #ffffff;
            font-weight: bold;
            min-height: 38px;
            word-break: break-all;
        }

        .result-box {
            background-color: #121214;
            border: 1px dashed #00b37e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
            text-align: center;
            display: none;
        }

        .result-title {
            font-size: 0.75rem;
            color: #a8a8b3;
            text-transform: uppercase;
        }

        .result-text {
            font-size: 1.2rem;
            color: #00b37e;
            font-weight: bold;
            margin-top: 4px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        button.key {
            background-color: #29292e;
            border: none;
            border-radius: 6px;
            color: #e1e1e6;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 0;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button.key:hover {
            background-color: #323238;
        }

        button.key:active {
            transform: scale(0.95);
        }

        button.key.action-c {
            background-color: rgba(247, 90, 104, 0.15);
            color: #f75a68;
        }

        button.key.action-c:hover {
            background-color: rgba(247, 90, 104, 0.25);
        }

        button.key.action-ok {
            grid-column: span 3;
            background-color: #00b37e;
            color: #ffffff;
        }

        button.key.action-ok:hover {
            background-color: #00875f;
        }

        button.key.action-reset {
            grid-column: span 3;
            background-color: #323238;
            color: #a8a8b3;
            margin-top: 2px;
            font-size: 0.85rem;
            padding: 8px 0;
        }
    </style>
</head>
<body>

    <!-- Fundo de Ícones Pixelados Flutuantes -->
    <div class="pixel-bg" id="pixelBg"></div>

    <div class="card-container">
        <h1>Mercado Habbo RP</h1>
        <div class="subtitle">Calculadora de Turnos</div>

        <!-- TELA DE LOGIN -->
        <div id="loginScreen">
            <div class="input-group">
                <label for="usernameInput">Habbo Username</label>
                <input type="text" id="usernameInput" class="input-field" placeholder="Digite seu nickname..." autocomplete="off">
            </div>

            <div class="error-message" id="errorMessage">
                Acesso negado. Usuário não autorizado!
            </div>

            <button class="btn-primary" onclick="attemptLogin()">Acessar Sistema</button>
        </div>

        <!-- TELA DA CALCULADORA -->
        <div id="calcScreen">
            <div class="user-header">
                <div>Operador: <span id="currentUser">-</span></div>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>

            <div class="goal-info">
                Meta Semanal: <span id="metaText">15 turnos</span>
            </div>

            <div class="step-indicator" id="stepIndicator">Passo 1 de 2: Turno Inicial</div>

            <div class="display-group">
                <div class="display-label" id="displayLabel">Informe o turno do início da semana</div>
                <div class="display-value" id="display">0</div>
            </div>

            <div class="result-box" id="resultBox">
                <div class="result-title">Situação Semanal</div>
                <div class="result-text" id="resultText">-</div>
            </div>

            <div class="keypad">
                <button class="key" onclick="appendNumber('7')">7</button>
                <button class="key" onclick="appendNumber('8')">8</button>
                <button class="key" onclick="appendNumber('9')">9</button>
                
                <button class="key" onclick="appendNumber('4')">4</button>
                <button class="key" onclick="appendNumber('5')">5</button>
                <button class="key" onclick="appendNumber('6')">6</button>
                
                <button class="key" onclick="appendNumber('1')">1</button>
                <button class="key" onclick="appendNumber('2')">2</button>
                <button class="key" onclick="appendNumber('3')">3</button>
                
                <button class="key" onclick="appendNumber('0')">0</button>
                <button class="key action-c" onclick="clearDisplay()">C</button>
                <button class="key" onclick="deleteNumber()">⌫</button>

                <button class="key action-ok" id="actionBtn" onclick="handleAction()">Confirmar Turno Inicial</button>
                <button class="key action-reset" onclick="resetAll()">Reiniciar Cálculo</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES DE ACESSO
        const allowedUsers = ["solyta", "chantal", "afrontoso"];
        const metaTurnos = 15; // Meta de turnos da semana

        // ESTADOS DA CALCULADORA
        let step = 1;
        let turnoInicial = 0;
        let turnoAtual = 0;
        let currentInput = "0";

        // GERAR ÍCONES NO FUNDO
        const bgIcons = ['🛒', '📦', '🪙', '🍎', '🥤', '🍞', '🏬'];
        const bgContainer = document.getElementById('pixelBg');

        for (let i = 0; i < 22; i++) {
            let icon = document.createElement('div');
            icon.className = 'pixel-icon';
            icon.innerText = bgIcons[Math.floor(Math.random() * bgIcons.length)];
            icon.style.left = Math.random() * 100 + '%';
            icon.style.animationDuration = (6 + Math.random() * 8) + 's';
            icon.style.animationDelay = (Math.random() * 5) + 's';
            bgContainer.appendChild(icon);
        }

        // SISTEMA DE LOGIN
        function attemptLogin() {
            const inputVal = document.getElementById("usernameInput").value.trim().toLowerCase();
            const errorMsg = document.getElementById("errorMessage");

            if (allowedUsers.includes(inputVal)) {
                errorMsg.style.display = "none";
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("calcScreen").style.display = "block";
                
                // Formatar nome do operador exibido
                const formattedName = inputVal.charAt(0).toUpperCase() + inputVal.slice(1);
                document.getElementById("currentUser").innerText = formattedName;
            } else {
                errorMsg.style.display = "block";
            }
        }

        // Permite pressionar Enter no campo do usuário para entrar
        document.getElementById("usernameInput").addEventListener("keypress", function(
